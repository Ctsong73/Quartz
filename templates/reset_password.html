{% extends "layout.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block main %}
<h1 class="mb-4">Reset Password</h1>
<form action="/reset_password" method="post">
    <div class="mb-3">
        <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="username" placeholder="Username"
            type="text" required>
    </div>
    <div class="mb-3">
        <input class="form-control mx-auto w-auto" name="recovery_answer" placeholder="Favorite Color (Recovery Secret)"
            type="text" required>
    </div>
    <hr class="my-4 w-50 mx-auto">
    <div class="mb-3">
        <input class="form-control mx-auto w-auto" name="new_password" placeholder="New Password" type="password"
            required>
    </div>
    <div class="mb-3">
        <input class="form-control mx-auto w-auto" name="confirmation" placeholder="Confirm New Password"
            type="password" required>
    </div>
    <button class="btn btn-warning" type="submit">Reset My Password</button>
</form>
<div class="mt-3">
    <a href="/login" class="small text-muted">Back to Log In</a>
</div>
{% endblock %}
